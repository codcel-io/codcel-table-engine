[package]
name = "codcel-table-engine"
version = "0.1.9"
edition = "2021"
rust-version = "1.89"
authors = ["Codcel <support@codcel.io>"]
description = "Backend-agnostic async trait for Excel-style table operations: VLOOKUP, XLOOKUP, INDEX, MATCH, FILTER and CRUD over any data store. Part of Codcel (codcel.io): Excel in, real code out."
readme = "README.md"
license = "MIT OR Apache-2.0"
repository = "https://github.com/codcel-io/codcel-table-engine"
homepage = "https://codcel.io"
keywords = ["excel", "spreadsheet", "lookup", "vlookup", "sql"]
categories = ["database", "asynchronous", "data-structures"]
include = [
    "src/**/*.rs",
    "README.md",
    "CONTRIBUTING.md",
    "LICENSE-MIT",
    "LICENSE-APACHE",
]

[package.metadata.docs.rs]
all-features = true
targets = ["x86_64-unknown-linux-gnu"]

[dependencies]
codcel-calculation-engine = "0.1.9"
async-trait = "0.1.91"
regex = "1.13.1"
once_cell = "1.21.4"
